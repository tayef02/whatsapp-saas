# লোকাল ডেভেলপমেন্টের জন্য: Evolution API + তার নিজস্ব Postgres + Redis
# Supabase (business ডাটা) এখানে নেই — সেটা cloud-hosted, শুধু .env.local এ কানেক্ট করা হয়

services:
  redis:
    image: redis:7-alpine
    container_name: whatsapp_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  evolution-postgres:
    image: postgres:16-alpine
    container_name: whatsapp_saas_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-api:
    # v2.1.1/v2.2.0 এ QR কোড infinite reconnect loop বাগ ছিল (QR কখনো জেনারেট হতো না),
    # v2.3.7 এ সেটা ফিক্সড — তাই পুরনো ভার্সন পিন করা যাবে না
    image: evoapicloud/evolution-api:v2.3.7
    container_name: whatsapp_saas_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - evolution/.env
    depends_on:
      - redis
      - evolution-postgres
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  redis_data:
  evolution_postgres_data:
  evolution_instances:
